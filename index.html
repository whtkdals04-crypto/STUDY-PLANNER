<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STUDY PLANNER</title>
  <style>
    :root {
      --bg: #f8fafc;
      --border: #475569;
      --border-light: #cbd5e1;
      --text: #0f172a;
      --primary-sangmin: #3b82f6;
      --primary-soi: #ec4899;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; color: var(--text); }
    .tab-container { width: 100%; max-width: 980px; display: flex; gap: 6px; margin-bottom: -2px; z-index: 10; }
    .tab-button { flex: 1; padding: 12px; font-size: 14px; font-weight: 800; text-align: center; background: #e2e8f0; color: #64748b; border: 2px solid var(--border); border-bottom: none; border-radius: 12px 12px 0 0; cursor: pointer; }
    .tab-button.active { background: #ffffff; color: var(--text); border-bottom: 2px solid #ffffff; }
    .planner-card { width: 100%; max-width: 980px; background: #ffffff; border: 2px solid var(--border); border-radius: 0 0 12px 12px; padding: 20px; min-height: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; }
    .table th, .table td { border: 1px solid var(--border-light); text-align: center; padding: 6px; font-size: 11px; }
    .time-col { width: 50px; background: #f1f5f9; font-weight: 800; }
    .slot-cell { height: 24px; cursor: pointer; background: #fff; }
  </style>
</head>
<body>

<div class="tab-container">
  <div id="tab-sangmin" class="tab-button active" onclick="switchTab('sangmin')">📘 PLANNER (상민)</div>
  <div id="tab-soi" class="tab-button" onclick="switchTab('soi')">📙 PLANNER (소이)</div>
</div>

<div class="planner-card">
  <div id="plannerView">
    <h2 id="ownerTitle" style="margin-top:0;">PLANNER (상민)</h2>
    <p style="font-size: 12px; color: #64748b;">시간표 칸을 터치하면 색상이 칠해집니다.</p>
    
    <table class="table">
      <thead>
        <tr>
          <th class="time-col">TIME</th>
          <th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>SUN</th>
        </tr>
      </thead>
      <tbody>
        <script>
          for(let h=9; h<=18; h++) {
            document.write(`<tr><td class="time-col">${h}:00</td>`);
            for(let d=0; d<7; d++) {
              document.write(`<td class="slot-cell" data-id="${d}-${h}" onclick="paintCell(this)"></td>`);
            }
            document.write(`</tr>`);
          }
        </script>
      </tbody>
    </table>
  </div>
</div>

<script>
  let currentTab = 'sangmin';

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById('ownerTitle').innerText = tab === 'sangmin' ? 'PLANNER (상민)' : 'PLANNER (소이)';
  }

  function paintCell(td) {
    td.style.backgroundColor = currentTab === 'sangmin' ? '#3b82f6' : '#ec4899';
  }
</script>

</body>
</html>
